server {
    listen 80;

    # Página del frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Las peticiones a /api/ se reenvían al contenedor de la API.
    # "api" es el nombre del servicio en docker-compose.yml.
    location /api/ {
        proxy_pass http://api:8000/;
    }
}
